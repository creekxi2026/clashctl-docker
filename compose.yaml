services:
  clashctl:
    image: ghcr.io/creekxi2026/clashctl-docker:latest
    restart: unless-stopped
    environment:
      SUB_URL: ${SUB_URL:-}
      UI_SECRET: ${UI_SECRET:-}
      SUB_UPDATE_INTERVAL: ${SUB_UPDATE_INTERVAL:-86400}
      # Only compose.ui.yaml opts into a container-wide controller listener.
      CONTROLLER_BIND: 127.0.0.1
    ports:
      - "${BIND_IP:-127.0.0.1}:${PROXY_PORT:-7890}:7890"
    volumes:
      - data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  data:
