# Container-owned listeners; do not expose controller or enable TUN.
mixed-port: 7890
port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
allow-lan: true
bind-address: '*'
external-controller: 127.0.0.1:9090
secret: ''
external-controller-tls: ''
external-controller-unix: ''
external-controller-pipe: ''
external-ui: ''
tun:
  enable: false
dns:
  enable: false
