[unix_http_server]
file=/tmp/clashctl-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/clashctl-supervisor.pid
childlogdir=/data

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/clashctl-supervisor.sock

[program:mihomo]
command=/opt/clashctl/bin/mihomo -d /data -f /data/runtime.yaml
directory=/data
autostart=true
autorestart=true
startsecs=1
startretries=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/data/mihomo.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true

[program:subscription-update]
command=/usr/local/bin/update-subscriptions
autostart=true
autorestart=unexpected
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/data/update.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
